# Release automation — two clearly separated cadences.
#
# This workflow implements the finalized release model (see
# docs/RELEASE_PROCESS.md for the full narrative). It carries TWO independent
# jobs on TWO independent cadences that must not be conflated:
#
#   1. promote-and-release  (DAILY + manual)
#      A CONTENT-GATED auto-promotion. It only acts when `develop` carries an
#      unreleased USER-FACING change since the LAST RELEASE TAG (≥1 Conventional
#      Commit of type feat or fix in the <last-tag>..develop range). If it does,
#      and CI on develop is green, it opens (or reuses) a `develop -> main` PULL
#      REQUEST and lets it AUTO-MERGE once required checks pass, then runs
#      release-it on main to stamp a calendar-date CalVer tag (YYYY.MM.DD) + a
#      GitHub Release whose body is the generated changelog.
#      Promotion is PR-BASED (not a direct `git push origin main`) so `main` can
#      stay fully protected against direct pushes. TAG CADENCE = per
#      content-bearing promotion (frequent). This job NEVER drafts or posts
#      social content.
#
#   2. weekly-digest  (WEEKLY, Monday + manual)
#      A DECOUPLED, DRAFT-ONLY release-communication job. It collects the week's
#      changes + governance provenance and produces the release-herald digest
#      (feature highlights + a LinkedIn/social post) as a DRAFT — emitted as a
#      workflow artifact AND an auto-created GitHub issue — then STOPS. A human
#      reviews and approves before anything is ever posted. SOCIAL CADENCE =
#      weekly (curated). This job never tags, never releases, never posts.
#
# WHY THE TWO ARE SEPARATE (do not merge them):
#   * Versions are minted whenever real change lands (could be several times a
#     week, or not at all on quiet weeks). Social communication is curated once
#     a week so followers get a single, coherent digest rather than a stream of
#     per-tag noise. Tag cadence != social cadence, by design.
#
# DESIGN NOTES WORTH KNOWING BEFORE YOU EDIT:
#
#   * DATE-VERSIONED. The version is the UTC calendar date of the promotion
#     (YYYY.MM.DD), not a SemVer bump and not a monthly YYYY.0M cycle. release-it
#     is SemVer-centric and cannot natively emit a zero-padded date (see
#     release-it#754), so the version is supplied by scripts/release-it-calver.mjs
#     and package.json is left untouched (`"npm": false`). Same-day releases get
#     a `.N` suffix. Nothing here derives a version from commit COUNT.
#
#   * CONTENT-GATE, NOT COUNT-GATE. The old model had a "promote after N PRs"
#     threshold. That is gone. The gate is SUBSTANCE: is there ≥1 feat/fix
#     unreleased on develop? Quiet days are quiet — no tag, no release, no post,
#     clean no-op exit. The heuristic is a Conventional-Commit scan of the
#     <last-release-tag>..develop range (see the "Content gate" step).
#
#   * THE GATE IS TAG-RELATIVE, NOT main-RELATIVE — THIS IS LOAD-BEARING.
#     "Unreleased" means "not covered by a release tag", NOT "not on main".
#     Promotion and stamping are two separate remote operations, so a run can
#     legitimately die in between: the promotion PR merges, then release-it
#     fails, and `main` now equals `develop` with nothing tagged. If the gate
#     asked "is main behind develop?" that half-done state would read as "nothing
#     to do" and the release would be silently stranded forever — a real incident
#     that happened on 2026-08-05. Comparing against the last tag instead makes
#     the job RESUMABLE: the next run sees the untagged content, skips the
#     already-done promotion, and stamps the release. Do not "simplify" this back
#     to a main..develop diff.
#
#   * AUTO-PROMOTE ON GREEN — SAFE BECAUSE DEVELOP IS ALREADY REVIEWED.
#     develop is the canonical, human-reviewed integration line; every change
#     reaches it via a reviewed feature-branch PR. Promotion is therefore a
#     fast-forward of already-reviewed work, so no SECOND human review is needed
#     at the promotion step by default. But promotion now happens through a
#     `develop -> main` PULL REQUEST that AUTO-MERGES on green, NOT a direct
#     `git push origin main`. That lets `main` be fully protected against direct
#     pushes (require-a-PR-before-merging) with NO bot bypass, while
#     require-develop-source.yml still guarantees the ONLY possible source of
#     that PR is `develop`. The human-approval gate in this model sits on the
#     WEEKLY DIGEST (job 2), not on the merge.
#
#   * GITHUB_TOKEN + on: pull_request NUANCE (read before you touch STEP 3).
#     A PR opened with the default `GITHUB_TOKEN` does NOT trigger
#     `on: pull_request` workflows (GitHub suppresses recursive workflow runs).
#     So if `main`'s protection REQUIRES status-check RE-RUNS on the promotion
#     PR, those checks never start and the auto-merge stalls forever. STEP 3
#     therefore opens/merges the PR with a **GitHub App token minted at runtime**
#     (via actions/create-github-app-token) instead of `GITHUB_TOKEN`. An
#     App-minted token is a first-class actor, so a PR it opens DOES trigger
#     `on: pull_request` — `check-source-branch`/`require-develop-source` run and
#     auto-merge can actually complete. The token is short-lived (minted per run,
#     auto-expires, nothing to rotate) and needs no PAT owned by a human.
#       - The App is installed on the org, scoped to THIS repo, with Contents
#         read/write + Pull requests read/write. STEP 3a mints the token from
#         `secrets.RELEASE_APP_ID` + `secrets.RELEASE_APP_PRIVATE_KEY`.
#       - GRACEFUL DEGRADATION: if those two secrets are NOT set, the mint step
#         is SKIPPED (its `if:` checks `secrets.RELEASE_APP_ID != ''`) and the
#         PR-open/merge step is gated on the token being present, so the job logs
#         "App secrets missing, skipping promotion" and exits cleanly — it does
#         NOT hard-error. The content gate and CI-green gate still run ahead of
#         all this. No promotion happens until an admin configures the App.
#     See docs/RELEASE_PROCESS.md for the App setup an admin applies and the two
#     secret names required.
#
#   * NO CHANGELOG.md COMMIT — THE RELEASE NEVER WRITES TO A BRANCH.
#     `main` is protected with `enforce_admins: true` and no bot bypass, so any
#     branch push from this job is rejected (GH006). release-it therefore runs
#     with `git.commit: false` and the conventional-changelog plugin with
#     `infile: false`: the generated changelog becomes the GITHUB RELEASE BODY
#     and no `chore(release): <version>` commit is ever created. Because there is
#     no local commit, release-it's `git push --follow-tags` sends no branch
#     update at all — only the annotated tag, which branch protection does not
#     govern. Tags and releases are the changelog of record.
#     The alternative (generate CHANGELOG.md on `develop` so it rides the
#     promotion PR) is NOT viable here: `develop` requires a PR plus one
#     approving code-owner review, so the release App can neither push to it nor
#     self-approve — it would put a human gate in front of every tag. Do NOT
#     "fix" this by granting the automation a protection bypass.
#
#   * NO NEW ROOT DEPENDENCIES. The repo root is intentionally dependency-free.
#     release-it and its plugins are installed on demand with
#     `npm install --no-save` (into gitignored node_modules, so package.json and
#     the working tree stay clean). A local install — not `npx -p` — is used so
#     the local CalVer plugin's `import { Plugin } from 'release-it'` resolves.
name: Release (CalVer date-versioned)

on:
  schedule:
    # DAILY promotion gate at 06:00 UTC (content-gated; often a no-op).
    - cron: "0 6 * * *"
    # WEEKLY digest, Mondays at 13:00 UTC (draft-only, human-approved).
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run manually."
        type: choice
        required: true
        default: promote
        options:
          - promote
          - digest
      dry_run:
        description: "promote only: run the gates, skip opening/merging the promotion PR, and run release-it with --dry-run so the version/changelog/tag path is exercised without tagging or publishing."
        type: boolean
        required: false
        default: false

# Never let two promotion/release runs race each other into main.
concurrency:
  group: release-automation
  cancel-in-progress: false

jobs:
  # =====================================================================
  # JOB 1 — CONTENT-GATED DAILY AUTO-PROMOTION (develop -> main + CalVer)
  # =====================================================================
  promote-and-release:
    name: Content-gated promote develop -> main and stamp CalVer date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run on the DAILY cron, or on a manual dispatch that selected "promote".
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'promote')
    permissions:
      # Push the CalVer tag and create the GitHub Release. No branch write is
      # made — see the "NO CHANGELOG.md COMMIT" note in the file header. (The
      # develop -> main promotion itself goes through a PR, below.)
      contents: write
      # Open / reuse / auto-merge the develop -> main promotion PR.
      pull-requests: write
      # Read commit statuses / check runs for the CI-green gate.
      checks: read
      statuses: read

    # The `secrets` context CANNOT be referenced from a step `if:` (GitHub only
    # allows it in `env`, `with`, and `run`). So we derive a plain boolean here at
    # the JOB level — where `secrets` IS allowed — and the mint step's `if:` reads
    # this env instead. This is what makes graceful degradation possible: when the
    # release App secrets are absent, HAS_APP_SECRETS is 'false' and the mint step
    # is skipped rather than the workflow erroring on an illegal secrets reference.
    env:
      HAS_APP_SECRETS: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}

    steps:
      # Full history + all tags: the content gate diffs main..develop, the
      # promotion needs both branch tips, and release-it reads existing tags for
      # same-day `.N` disambiguation.
      - name: Check out repository (full history + tags)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Show Node toolchain versions
        run: |
          node --version
          npm --version

      # release-it authors the annotated CalVer tag, and the promotion may author
      # a merge commit — both need a git identity. Use the GitHub Actions bot
      # identity, never a human's.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ---------------------------------------------------------------------
      # STEP 1 — CONTENT GATE (the heart of this model)
      # ---------------------------------------------------------------------
      # Decide whether there is anything USER-FACING to release. The heuristic:
      # scan the Conventional Commit subjects in the <last-release-tag>..develop
      # range (everything on develop not covered by the last tag) and count those
      # of type `feat` or `fix`, including scoped and breaking (`!`) forms: e.g.
      # `feat: ...`, `fix(x): ...`, `feat(x)!: ...`.
      #
      #   * ≥1 feat/fix  -> there is user-facing substance; proceed.
      #   * 0 feat/fix   -> nothing to release; clean no-op exit (quiet days are
      #                     fine). No tag, no release, no post.
      #
      # This is CONTENT, not COUNT: one feat is enough; a hundred chore/docs/ci
      # commits are not. `docs`, `chore`, `refactor`, `test`, `ci`, `build`,
      # `style`, and merge commits are intentionally NOT release triggers.
      #
      # The baseline is the LAST RELEASE TAG, not `main` — see the "TAG-RELATIVE"
      # design note in the file header. That is what lets a run whose promotion
      # merged but whose stamping failed be picked up and finished by the next
      # run instead of being stranded. Tags are ordered by creation date rather
      # than name because CalVer `YYYY.MM.DD[.N]` is not SemVer-sortable.
      - name: Content gate — any unreleased feat/fix on develop?
        id: gate
        run: |
          set -euo pipefail
          git fetch origin develop main --tags

          # Only CalVer-shaped tags (YYYY.MM.DD[.N]) count as releases, so an
          # unrelated tag someone pushes by hand cannot silently redefine "the
          # last release" and swallow a release window. `|| true` absorbs both a
          # no-match grep and a SIGPIPE from `head` closing the pipe early.
          LAST_TAG=$(git tag --list --sort=-creatordate \
            | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' \
            | head -n1 || true)
          if [ -z "${LAST_TAG}" ]; then
            echo "No release tag yet — treating all of develop as unreleased."
            RANGE="origin/develop"
          else
            echo "Last release tag: ${LAST_TAG}"
            RANGE="${LAST_TAG}..origin/develop"
          fi
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"

          echo "::group::Unreleased commit subjects (${RANGE})"
          git log --no-merges --pretty=format:'%s' "${RANGE}" || true
          echo ""
          echo "::endgroup::"

          # Count Conventional-Commit feat/fix subjects (scoped/breaking allowed).
          # `grep -c` exits 1 on no match, which `set -e` would treat as fatal, so
          # the count is forced to 0 rather than failing the gate.
          FEATFIX=$(git log --no-merges --pretty=format:'%s' "${RANGE}" \
            | grep -cE '^(feat|fix)(\([^)]+\))?!?:' || true)
          FEATFIX=${FEATFIX:-0}

          echo "Unreleased feat/fix commits: ${FEATFIX}"
          if [ "${FEATFIX}" -eq 0 ]; then
            echo "Nothing to release: no unreleased user-facing (feat/fix) change on develop."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # STEP 2 — CI-GREEN GATE
      # ---------------------------------------------------------------------
      # Only auto-merge already-reviewed develop if its head is CI-green. We read
      # the combined commit status AND the check-runs conclusion for develop's
      # head via the REST API; if either reports a failure, we stop rather than
      # promote a red integration line.
      - name: CI-green gate — is develop's head green?
        id: ci
        if: ${{ steps.gate.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse origin/develop)
          echo "Checking CI for develop @ ${SHA}"

          # (a) Combined legacy commit status (e.g. required status checks).
          STATE=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/status" --jq '.state')
          echo "Combined status state: ${STATE}"

          # (b) Check-runs (GitHub Actions et al.). Any non-success/neutral/
          #     skipped conclusion on a COMPLETED run counts as not-green.
          BAD=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
            --jq '[.check_runs[] | select(.status=="completed") | select(.conclusion|IN("success","neutral","skipped")|not)] | length')
          echo "Non-green completed check-runs: ${BAD}"

          # 'pending' combined status with no check-runs happens when no legacy
          # status contexts exist; treat only explicit failure/error as red.
          if [ "${STATE}" = "failure" ] || [ "${STATE}" = "error" ] || [ "${BAD}" -ne 0 ]; then
            echo "develop is NOT green — refusing to promote."
            echo "green=false" >> "$GITHUB_OUTPUT"
          else
            echo "develop is green."
            echo "green=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # STEP 2b — IS A PROMOTION ACTUALLY NEEDED?
      # ---------------------------------------------------------------------
      # Separate "does main need develop's content?" from "is there something to
      # release?" (STEP 1 already answered the latter). They are NOT the same
      # question, and conflating them is what stranded the 2026-08-05 release:
      # `main` had already been promoted, so a main..develop check said "nothing
      # to do" even though the content was still untagged.
      #
      #   behind > 0  -> main is missing develop's content; open the promotion PR.
      #   behind = 0  -> main already carries it (either promoted earlier in this
      #                  run's history, or by a previous run that then failed to
      #                  stamp). Skip straight to stamping the release.
      - name: Is main behind develop?
        id: behind
        if: ${{ steps.gate.outputs.release == 'true' && steps.ci.outputs.green == 'true' }}
        run: |
          set -euo pipefail
          BEHIND=$(git rev-list --count origin/main..origin/develop)
          echo "main is ${BEHIND} commit(s) behind develop."
          if [ "${BEHIND}" = "0" ]; then
            echo "main already carries develop's content — no promotion PR needed."
            echo "Unreleased content exists but is untagged, so this run resumes at the"
            echo "release-stamping step (see the TAG-RELATIVE note in the file header)."
          fi
          echo "count=${BEHIND}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # STEP 3 — PROMOTE develop -> main VIA AN AUTO-MERGED PULL REQUEST
      # ---------------------------------------------------------------------
      # develop is already the reviewed integration line, so this is a promotion
      # of reviewed work — no SECOND review is required by default. But we no
      # longer `git push origin main` directly: we open (or reuse) a
      # `develop -> main` PR and let it AUTO-MERGE once main's required checks
      # pass. That keeps `main` fully protected against direct pushes while
      # require-develop-source.yml still guarantees the PR can only come from
      # develop.
      #
      # MERGE APPROACH — GitHub native auto-merge (`gh pr merge --auto --merge`),
      # NOT hand-rolled poll-then-merge-via-API. Rationale:
      #   * Branch protection on `main` is the single source of truth for whether
      #     a merge is allowed; `--auto` DELEGATES the gate to protection and
      #     merges the instant required checks pass. Poll-then-merge would
      #     re-implement (and could drift from) that gate.
      #   * Auto-merge is DURABLE: it is not bound by this job's 15-minute
      #     timeout. If checks are slow, GitHub still merges later; a poll loop
      #     would just time out and abandon a green PR.
      #   * We choose `--merge` (a merge commit) over squash/rebase so the
      #     promotion is a faithful record of the reviewed develop history.
      # We still poll AFTERWARD, but only to learn WHEN the merge landed, so
      # STEP 5 can stamp the release on the freshly-merged `main` in the same run.
      # (If auto-merge cannot be enabled — the repo's "Allow auto-merge" setting
      # is off, or main has no required checks so there is nothing to wait on — we
      # fall back to an immediate `gh pr merge --merge`, which succeeds when main
      # only requires "must be a PR" and develop's checks already passed.)
      #
      # TOKEN: open/merge the PR with the GitHub App token minted in STEP 3a so
      # `on: pull_request` checks actually run on it (a GITHUB_TOKEN-opened PR does
      # not trigger them). See the file header and docs/RELEASE_PROCESS.md.

      # ---------------------------------------------------------------------
      # STEP 3a — MINT A GITHUB APP TOKEN (short-lived, per-run)
      # ---------------------------------------------------------------------
      # Mint an installation access token for the release GitHub App. Because it
      # is a distinct actor (not GITHUB_TOKEN), the promotion PR it opens DOES
      # trigger `on: pull_request` required checks, so check-source-branch runs
      # and auto-merge can complete. The token is short-lived and auto-expires —
      # nothing to rotate.
      #
      # GRACEFUL DEGRADATION: only run when BOTH App secrets are present. The
      # `secrets` context cannot be used in a step `if:`, so we read the
      # job-level `env.HAS_APP_SECRETS` boolean derived above instead. When the
      # secrets are absent this step is SKIPPED (not failed), its token output is
      # empty, and the PR step below is gated on that output being non-empty — so
      # the job cleanly no-ops instead of crashing.
      #
      # Only minted when a promotion is actually needed (`behind.count != 0`). A
      # resume run that only has to stamp an already-promoted main never opens a
      # PR, so it needs no App token and works even before the App is configured.
      - name: Mint GitHub App token for promotion PR
        id: app-token
        if: >-
          ${{ steps.gate.outputs.release == 'true' && steps.ci.outputs.green == 'true' &&
              steps.behind.outputs.count != '0' && env.HAS_APP_SECRETS == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # GRACEFUL DEGRADATION: if a promotion is needed but no App token was minted
      # (the App secrets are not configured), say so loudly and exit the job
      # cleanly. This is a no-op, NOT a failure — the release infrastructure is
      # simply not wired up yet.
      - name: Note skipped promotion when App secrets are absent
        if: >-
          ${{ steps.gate.outputs.release == 'true' && steps.ci.outputs.green == 'true' &&
              steps.behind.outputs.count != '0' && env.HAS_APP_SECRETS != 'true' }}
        run: |
          echo "::warning::RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are not set."
          echo "There is unreleased user-facing change and develop is green, but the"
          echo "release GitHub App is not configured, so no promotion PR can be opened."
          echo "No promotion will happen and NO release is stamped this run (clean no-op)."
          echo "An admin must create/install the release App and set the two secrets —"
          echo "see docs/RELEASE_PROCESS.md."

      - name: Open promotion PR (develop -> main) and auto-merge on green
        id: promote
        # Gate on the App token being present too: if STEP 3a was skipped (App
        # secrets not set) its token output is empty, so this whole step is
        # skipped and the job cleanly no-ops instead of erroring. Also skipped
        # when main already carries develop's content — nothing to promote.
        if: >-
          ${{ steps.gate.outputs.release == 'true' && steps.ci.outputs.green == 'true' &&
              steps.behind.outputs.count != '0' && steps.app-token.outputs.token != '' }}
        env:
          # Use the App-minted token so the promotion PR triggers on: pull_request
          # required checks (a GITHUB_TOKEN-opened PR does not trigger them).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          git fetch origin develop main --tags

          if [ "${DRY_RUN}" = "true" ]; then
            echo ">>> DRY RUN: would open (or reuse) a develop -> main PR and enable"
            echo "    auto-merge (--merge). No PR is opened and nothing is merged."
            echo "    The release-it step still runs below with --dry-run so the"
            echo "    version/changelog/tag path is genuinely exercised."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR opened with the GitHub App token: on: pull_request checks will run on it,"
          echo "so check-source-branch runs and auto-merge can complete."

          # Reuse an already-open develop -> main PR if one exists (idempotent
          # across retries), otherwise create it.
          PR_NUM=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head develop \
            --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUM" ]; then
            printf '%s\n\n%s\n' \
              'Automated content-gated promotion of `develop` into `main`.' \
              "There is at least one unreleased \`feat\`/\`fix\` on develop and develop's CI is green. develop is the reviewed integration line, so no second review is required by default; this PR exists so \`main\` can stay protected against direct pushes. It auto-merges once main's required checks pass; release-it then stamps the CalVer \`YYYY.MM.DD\` tag and a GitHub Release (whose body is the generated changelog) on main — no commit is ever pushed to \`main\`. See docs/RELEASE_PROCESS.md." \
              > /tmp/promotion-pr-body.md
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head develop \
              --title "chore(release): promote develop into main" \
              --body-file /tmp/promotion-pr-body.md
            PR_NUM=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head develop \
              --state open --json number --jq '.[0].number')
            echo "Opened promotion PR #${PR_NUM}."
          else
            echo "Reusing already-open promotion PR #${PR_NUM}."
          fi

          # Enable GitHub native auto-merge; fall back to an immediate merge when
          # auto-merge is unavailable (setting off, or no required checks to wait
          # on).
          if gh pr merge "$PR_NUM" --repo "$GITHUB_REPOSITORY" --merge --auto; then
            echo "Auto-merge enabled on PR #${PR_NUM} (will merge when required checks pass)."
          else
            echo "Could not enable auto-merge; attempting an immediate merge."
            gh pr merge "$PR_NUM" --repo "$GITHUB_REPOSITORY" --merge || true
          fi

          # Poll only to learn WHEN the merge landed (auto-merge itself is durable
          # and not bound by this timeout). ~10 min budget within the job's 15.
          MERGED=false
          for i in $(seq 1 30); do
            STATE=$(gh pr view "$PR_NUM" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')
            echo "poll ${i}/30: PR #${PR_NUM} state = ${STATE}"
            if [ "$STATE" = "MERGED" ]; then MERGED=true; break; fi
            if [ "$STATE" = "CLOSED" ]; then
              echo "PR #${PR_NUM} was closed without merging — aborting promotion."
              break
            fi
            sleep 20
          done

          if [ "$MERGED" != "true" ]; then
            echo "Promotion PR #${PR_NUM} did not merge within the polling window."
            echo "The PR was opened with the App token, so its on: pull_request checks should"
            echo "run; a slow or still-pending required check is the likely cause. The PR stays"
            echo "open; auto-merge (if enabled) may still complete later, and the next scheduled"
            echo "run will re-check it. NO release is stamped this run — a safe no-op rather than"
            echo "a half-done promotion."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Promotion PR #${PR_NUM} merged. Proceeding to stamp the release on main."
          echo "merged=true" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # STEP 3b — DECIDE WHETHER TO STAMP
      # ---------------------------------------------------------------------
      # Stamping is warranted when there is unreleased content (STEP 1) AND main
      # now carries it. Two ways that second condition is met:
      #
      #   * this run merged the promotion PR (`promote.merged == true`), or
      #   * main already carried it (`behind.count == 0`) — the RESUME path for a
      #     previous run that promoted but died before tagging.
      #
      # A dry run always stamps (with --dry-run) so the release tooling path is
      # genuinely exercised rather than skipped. Before this step existed, a dry
      # run exited at the promote step and proved nothing about release-it — which
      # is exactly why the 2026-08-05 real run failed on a path a "successful" dry
      # run had never touched.
      - name: Decide whether to stamp a release
        id: stamp
        if: ${{ steps.gate.outputs.release == 'true' && steps.ci.outputs.green == 'true' }}
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN: exercising the release path against the current main."
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.promote.outputs.merged }}" = "true" ]; then
            echo "Promotion merged in this run — stamping the release."
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.behind.outputs.count }}" = "0" ]; then
            echo "main already carries the unreleased content — resuming and stamping it."
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "No promotion landed this run — not stamping (safe no-op)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # STEP 3c — SYNC local main to origin/main
      # ---------------------------------------------------------------------
      # Any merge happened server-side (via the PR), so the local `main` checked
      # out at job start may be stale. Re-sync before release-it tags it.
      #
      # `reset --hard` is also what guarantees the local branch is IDENTICAL to
      # the remote, which is what makes release-it's `git push --follow-tags`
      # push the tag ONLY — see the "NO CHANGELOG.md COMMIT" header note.
      - name: Sync local main to origin/main
        if: ${{ steps.stamp.outputs.go == 'true' }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git checkout main
          git reset --hard origin/main

      # ---------------------------------------------------------------------
      # STEP 4 — Install release tooling on demand (kept out of package.json)
      # ---------------------------------------------------------------------
      # --no-save installs into gitignored node_modules without touching
      # package.json, so the root stays dependency-free and the working tree
      # stays clean (release-it requires a clean tree). A real install (not
      # `npx -p`) is required so the local CalVer plugin can
      # `import { Plugin } from 'release-it'`.
      - name: Install release-it and plugins (on demand, --no-save)
        if: ${{ steps.stamp.outputs.go == 'true' }}
        run: |
          npm install --no-save --no-package-lock \
            release-it @release-it/conventional-changelog

      # ---------------------------------------------------------------------
      # STEP 5 — RELEASE: stamp the CalVer date on main
      # ---------------------------------------------------------------------
      # --ci makes release-it non-interactive. The CalVer plugin supplies the
      # YYYY.MM.DD version (with .N same-day disambiguation); the
      # conventional-changelog plugin renders the changelog straight into the
      # GitHub Release body. NO social posting here — that is the weekly-digest
      # job's concern.
      #
      # BRANCH-PROTECTION: this step writes NOTHING to the `main` branch. With
      # `git.commit: false` and `infile: false` there is no `chore(release):`
      # commit and no CHANGELOG.md, so `git push --follow-tags` carries only the
      # annotated tag — and tags/releases are not governed by branch protection.
      # This is the fix for the GH006 failure on 2026-08-05, where the changelog
      # commit was rejected by main's protection and took the tag down with it.
      # Do NOT re-enable `git.commit` without also granting a protection bypass,
      # which this repository deliberately refuses to do.
      #
      # TOKEN CHOICE: release-it uses the default GITHUB_TOKEN. Creating a tag and
      # a Release needs no App token — the App token's only special property is
      # triggering `on: pull_request` checks, which mattered solely for the
      # promotion PR. Keeping GITHUB_TOKEN here avoids widening the App token's
      # blast radius, and lets the resume path stamp a release even when the App
      # is not configured at all.
      - name: Run release-it (CalVer tag + GitHub Release)
        if: ${{ steps.stamp.outputs.go == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx release-it --ci ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}

  # =====================================================================
  # JOB 2 — WEEKLY, HUMAN-APPROVED DRAFT DIGEST (decoupled from tags)
  # =====================================================================
  # This job is intentionally SEPARATE from promotion. It runs weekly, collects
  # the week's user-facing changes + governance provenance, and produces the
  # release-herald digest as a DRAFT (artifact + auto-created issue), then STOPS.
  # A human reviews and approves before anything is posted anywhere. Real social
  # posting is NOT built here — the human approves, then posts.
  weekly-digest:
    name: Draft weekly release-herald digest (human-approved before posting)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run on the WEEKLY cron, or on a manual dispatch that selected "digest".
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * 1') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'digest')
    permissions:
      contents: read
      # Open the draft-digest issue for human approval.
      issues: write

    steps:
      - name: Check out repository (full history + tags)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true

      # ---------------------------------------------------------------------
      # STEP 1 — Collect the week's material for the digest
      # ---------------------------------------------------------------------
      # Gather the user-facing (feat/fix) and documentation-as-deliverable (docs)
      # commit subjects from the last 7 days on develop. This is raw INPUT to the
      # release-herald skill (skills/reporting/release-herald.md), which a human
      # or an agent turns into benefit-language highlights + a social post. The
      # skill filters non-user-facing entries; here we pre-filter to keep the
      # draft focused.
      - name: Collect this week's changes
        id: collect
        run: |
          set -euo pipefail
          SINCE="7 days ago"
          {
            echo "## Feature highlights (feat) — last 7 days"
            git log --no-merges --since="${SINCE}" --pretty=format:'- %s (%h)' origin/develop \
              | grep -E '^\- feat(\([^)]+\))?!?:' || echo "- (none this week)"
            echo ""
            echo "## Fixes (fix) — last 7 days"
            git log --no-merges --since="${SINCE}" --pretty=format:'- %s (%h)' origin/develop \
              | grep -E '^\- fix(\([^)]+\))?!?:' || echo "- (none this week)"
            echo ""
            echo "## Docs-as-deliverable (docs) — last 7 days"
            git log --no-merges --since="${SINCE}" --pretty=format:'- %s (%h)' origin/develop \
              | grep -E '^\- docs(\([^)]+\))?!?:' || echo "- (none this week)"
          } > week-changes.md
          echo "Collected:"
          cat week-changes.md

      # ---------------------------------------------------------------------
      # STEP 2 — Assemble the DRAFT digest (draft-only; never posts)
      # ---------------------------------------------------------------------
      # Wrap the collected material in the release-herald framing. This is a DRAFT
      # for HUMAN APPROVAL — it is not a finished post and nothing is sent to any
      # channel. Governance provenance and benefit-language rewriting are done by
      # a human/agent applying skills/reporting/release-herald.md to this input.
      - name: Assemble draft digest
        id: draft
        run: |
          set -euo pipefail
          WEEK=$(date -u +'%G-W%V')
          {
            echo "# DRAFT — Weekly release digest ${WEEK}"
            echo ""
            echo "> **STATUS: DRAFT — human approves, then posts.** This is produced"
            echo "> by the weekly-digest job as raw input for the release-herald skill"
            echo "> (\`skills/reporting/release-herald.md\`). Nothing here is posted."
            echo "> A human reviews it, rewrites highlights in benefit language, attaches"
            echo "> governance provenance (academia + analyst firms + MSP field input),"
            echo "> approves, and only THEN posts through the normal approved channel."
            echo ""
            cat week-changes.md
            echo ""
            echo "## LinkedIn / social post (DRAFT — fill in from highlights above)"
            echo ""
            echo "> Draft one benefit-led post per skills/reporting/release-herald.md."
            echo "> Reference the latest CalVer tag and a \`<release-link>\` placeholder."
            echo "> Do NOT post until a human has approved."
          } > digest-draft.md
          echo "Draft assembled."
          cat digest-draft.md

      # Emit the draft as a workflow artifact (one delivery surface).
      - name: Upload draft digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-release-digest-draft
          path: |
            digest-draft.md
            week-changes.md

      # ---------------------------------------------------------------------
      # STEP 3 — Open an auto-created issue holding the draft (approval gate)
      # ---------------------------------------------------------------------
      # The issue is the human-approval gate: it holds the draft text and asks a
      # human to review/approve before posting. It is NOT a post; it never sends
      # anything to a social channel.
      - name: Open draft-digest issue for human approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WEEK=$(date -u +'%G-W%V')
          gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "DRAFT weekly release digest ${WEEK} — needs human approval before posting" \
            --body-file digest-draft.md
