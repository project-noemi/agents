# Phase 1 of docs/AI_REVIEW_GOVERNANCE.md — cross-model review of
# agent-authored pull requests.
#
# The reviewer POSTS FINDINGS ONLY. It does not approve, merge, or close.
# Approval stays with a human until phase 2 is authorised by the evidence
# described in the governance doc.
#
# REQUIRED CHECK SPLIT: This workflow defines TWO jobs with distinct names:
#   - "AI Review (fork notice)" — unprivileged, fails on fork PRs (NOT required)
#   - "AI Review (advisory)" — privileged, runs actual review (IS REQUIRED on develop)
# The split prevents race conditions: fork PRs cannot merge while the privileged
# advisory is pending/running, and cannot merge if no privileged advisory ever ran.
# Branch protection on `develop` MUST require "AI Review (advisory)" (exact name).
#
# FORK PR HANDLING: This workflow triggers on `pull_request`,
# `pull_request_target` (labeled only), and `workflow_dispatch`. Fork PRs
# receive special handling due to GitHub's security model:
#
# CRITICAL: GitHub withholds repository/org secrets and variables from
# pull_request, pull_request_review, and pull_request_review_comment events
# on fork PRs (https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions#using-secrets-in-a-workflow).
# This means pull_request_review CANNOT auto-trigger privileged review on fork
# approval — it has the same empty-vars restriction as pull_request.
#
# Fork PR flow:
#
# 1. On `pull_request` (fork PR arrives/updates): Configuration unavailable, so
#    "AI Review (fork notice)" FAILS VISIBLY. Error message instructs maintainers
#    to add 'ai-review' label (preferred) or use workflow_dispatch (fallback).
#
# 2. On `pull_request_target: [labeled]` with label='ai-review': MAINTAINER-GATED
#    privileged review. "AI Review (advisory)" runs in base repository context
#    with access to secrets/variables. On blocking findings, dismisses approvals
#    and removes label.
#
# 3. On `workflow_dispatch`: Manual trigger (base context, privileged). "AI Review
#    (advisory)" runs; on blocking findings, dismisses approvals but keeps label.
#
# LABEL GATE SAFETY: The pull_request_target: [labeled] trigger ONLY fires when
# a maintainer adds the 'ai-review' label, and the job condition verifies
# github.event.label.name == 'ai-review'. This prevents:
#   - Auto-review on open/sync (would be unconstrained pull_request_target)
#   - Review triggered by non-maintainer labels (label addition is privileged)
#   - Malicious fork triggering privileged review without maintainer action
# The workflow still NEVER checks out PR head code (only project-noemi/agents
# at pinned ref), fetches diff via API only, and uses tooling-repo scripts.
#
# FLEET DEPLOYMENT: this is a REUSABLE workflow (workflow_call). Other
# repositories run the reviewer through a thin caller — see
# templates/ci/ai-review-caller.yml — so the review logic exists in exactly one
# place. Reviewer scripts are always checked out from the tooling repository at
# a pinned ref, never from the pull request under review: a PR must not be able
# to rewrite the reviewer that judges it.
#
# Configuration comes from Actions VARIABLES resolved in the caller's context —
# set them at the ORGANIZATION level so member repos need none of their own.
# No credential is stored in GitHub. The GitHub token comes from Infisical via
# OIDC, and Google access comes from Workload Identity Federation — required
# here, since org policy disallows API keys and service-account keys alike.
#
# The carve-out, gate ordering, and severity rubric are enforced inside
# scripts/review-pr.js — deliberately not duplicated here. Two copies of a
# safety rule drift, and the copy in YAML is the one nobody unit-tests.
name: AI Review (advisory)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to review'
        required: true
        type: string
  workflow_call:
    inputs:
      pr:
        description: 'Pull request number (defaults to the triggering PR)'
        required: false
        type: string
      tooling-ref:
        description: 'Ref of project-noemi/agents to take reviewer scripts from'
        required: false
        type: string
        # main, not develop: reviewer scripts ride the release train like the
        # workflow itself, so the fleet runs only human-reviewed reviewer code.
        default: main

permissions:
  contents: read
  pull-requests: write
  id-token: write          # required to mint the OIDC token for Infisical

concurrency:
  # Repository-qualified: many repos call this workflow, and PR numbers collide
  # across them.
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  # Unprivileged fork notice: runs on pull_request when config unavailable.
  # Fails visibly to prevent silent green. NOT a required check.
  fork-notice:
    name: AI Review (fork notice)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check reviewer configuration
        id: config
        env:
          PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [[ -z "${PROJECT_ID}"   ]] && missing+=(INFISICAL_PROJECT_ID)
          [[ -z "${IDENTITY_ID}"  ]] && missing+=(INFISICAL_IDENTITY_ID)
          [[ -z "${WIF_PROVIDER}" ]] && missing+=(GCP_WIF_PROVIDER)
          [[ -z "${GCP_SA}"       ]] && missing+=(GCP_SERVICE_ACCOUNT)
          if (( ${#missing[@]} )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Fail visibly when configuration is unavailable (fork PRs). This job
      # does NOT run on pull_request_target or workflow_dispatch, so it only
      # fails for unprivileged fork PRs. The "AI Review (advisory)" job will
      # run the actual review once the ai-review label is added.
      - name: Fail on missing configuration
        if: steps.config.outputs.configured == 'false'
        run: |
          echo "::error title=AI review unavailable (fork PR)::Missing Actions variables: ${{ steps.config.outputs.missing }}. GitHub withholds secrets/variables from pull_request on fork PRs. Maintainers: add the 'ai-review' label to trigger the privileged 'AI Review (advisory)' check, or use workflow_dispatch. For in-repo branches: set variables at the organization level. See docs/AI_REVIEW_GOVERNANCE.md § Fork Pull Requests."
          exit 1

      # If config IS available (in-repo branch), this job succeeds and lets
      # the "AI Review (advisory)" job run the actual review.
      - name: Config available
        if: steps.config.outputs.configured == 'true'
        run: |
          echo "::notice title=Config available::In-repo branch with config; the 'AI Review (advisory)' job will run the full review."

  # Privileged advisory: runs on in-repo pull_request (with config),
  # pull_request_target: [labeled] (ai-review label), and workflow_dispatch.
  # This is the job that MUST be required on `develop` branch protection.
  advisory:
    name: AI Review (advisory)
    runs-on: ubuntu-latest
    # Run when:
    # 1. pull_request AND config available (in-repo branch), OR
    # 2. pull_request_target with ai-review label, OR
    # 3. workflow_dispatch, OR
    # 4. workflow_call
    # The fork-notice job handles the unprivileged pull_request path.
    if: |
      (github.event_name == 'pull_request' && vars.INFISICAL_PROJECT_ID != '') ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'ai-review') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call'
    steps:
      # Resolve PR number from event or input
      - name: Resolve PR number and trigger context
        id: pr
        run: |
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "is_label_gated=true" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number || inputs.pr }}" >> "$GITHUB_OUTPUT"
            echo "is_label_gated=false" >> "$GITHUB_OUTPUT"
          fi

      # ALWAYS the tooling repo at a pinned ref — never the PR head.
      - uses: actions/checkout@v4
        with:
          repository: project-noemi/agents
          ref: ${{ inputs.tooling-ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Double-check config (should be available if we reached this job)
      - name: Check reviewer configuration
        id: config
        env:
          PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [[ -z "${PROJECT_ID}"   ]] && missing+=(INFISICAL_PROJECT_ID)
          [[ -z "${IDENTITY_ID}"  ]] && missing+=(INFISICAL_IDENTITY_ID)
          [[ -z "${WIF_PROVIDER}" ]] && missing+=(GCP_WIF_PROVIDER)
          [[ -z "${GCP_SA}"       ]] && missing+=(GCP_SERVICE_ACCOUNT)
          if (( ${#missing[@]} )); then
            echo "::error title=Privileged advisory misconfiguration::This job should only run when config is available, but variables are missing: ${missing[*]}. Check job conditions."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      # Federation, not a key.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        id: gcpauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical
          infisical --version

      - name: Authenticate to Infisical via OIDC
        env:
          IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          OIDC_AUDIENCE: ${{ vars.INFISICAL_OIDC_AUDIENCE || 'infisical' }}
        run: |
          JWT=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${OIDC_AUDIENCE}" | jq -r .value)
          if [[ -z "$JWT" || "$JWT" == "null" ]]; then
            echo "::error title=OIDC token unavailable::Could not mint a GitHub identity token."
            exit 1
          fi
          TOKEN=$(infisical login --method=oidc-auth \
            --machine-identity-id="$IDENTITY_ID" --jwt="$JWT" --plain --silent)
          echo "::add-mask::$TOKEN"
          echo "INFISICAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Resolve reviewer App ID
        id: appid
        env:
          PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          VAR_APP_ID: ${{ vars.REVIEWER_APP_ID }}
        run: |
          APP_ID="${VAR_APP_ID}"
          if [[ -z "$APP_ID" ]]; then
            APP_ID=$(infisical secrets get REVIEWER_APP_ID \
              --projectId="$PROJECT_ID" --env=dev --plain || true)
          fi
          if [[ -n "$APP_ID" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "REVIEWER_APP_ID=$APP_ID" >> "$GITHUB_ENV"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch reviewer app key
        if: steps.appid.outputs.present == 'true'
        env:
          PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          KEY=$(infisical secrets get REVIEWER_APP_PRIVATE_KEY \
            --projectId="$PROJECT_ID" --env=dev --plain)
          if [[ -z "$KEY" ]]; then
            echo "::error title=App key missing::REVIEWER_APP_ID resolved but REVIEWER_APP_PRIVATE_KEY missing."
            exit 1
          fi
          while IFS= read -r line; do echo "::add-mask::$line"; done <<< "$KEY"
          {
            echo "REVIEWER_APP_KEY<<__PEM_EOF__"
            echo "$KEY"
            echo "__PEM_EOF__"
          } >> "$GITHUB_ENV"

      - name: Mint reviewer app token
        if: steps.appid.outputs.present == 'true'
        id: apptoken
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.REVIEWER_APP_ID }}
          private-key: ${{ env.REVIEWER_APP_KEY }}

      - name: Run three-gate review
        id: review
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          REVIEWER_APP_TOKEN: ${{ steps.apptoken.outputs.token }}
          GEMINI_REVIEW_FLOOR: ${{ vars.GEMINI_REVIEW_FLOOR || 'pro' }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GCP_ACCESS_TOKEN: ${{ steps.gcpauth.outputs.access_token }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT || 'project-noemi' }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
          GEMINI_BACKEND: ${{ vars.GEMINI_BACKEND || 'vertex' }}
          GEMINI_PREFER_PRO: ${{ vars.GEMINI_PREFER_PRO || '1' }}
          GEMINI_REVIEW_MODEL: ${{ vars.GEMINI_REVIEW_MODEL || 'auto' }}
          GEMINI_ALLOW_PREVIEW: ${{ vars.GEMINI_ALLOW_PREVIEW || '1' }}
          GEMINI_PREFER_PREVIEW_PRO: ${{ vars.GEMINI_PREFER_PREVIEW_PRO || '1' }}
          REVIEW_TOOLING_REF: ${{ inputs.tooling-ref || 'develop' }}
        run: |
          export REVIEW_HALT_FILE="$RUNNER_TEMP/ai-review-halt"
          export REVIEW_FINDINGS_FILE="$RUNNER_TEMP/ai-review-findings.json"
          rm -f "$REVIEW_HALT_FILE" "$REVIEW_FINDINGS_FILE"
          set +e
          infisical run --projectId="$INFISICAL_PROJECT_ID" --env=dev -- \
            node scripts/review-pr.js --pr "$PR_NUMBER" --floor pro --prefer-pro --prefer-preview-pro --allow-preview
          code=$?
          set -e
          if [[ -f "$REVIEW_HALT_FILE" ]]; then
            echo "::notice title=Review halted::$(cat "$REVIEW_HALT_FILE") — escalated to human review by design."
            exit 0
          fi
          if [[ $code -ne 0 ]]; then
            echo "::error title=Review failed::review-pr.js exited ${code}. No review was performed."
            exit $code
          fi
          # Phase 1: succeed even when findings exist (advisory-only)
          if [[ -f "$REVIEW_FINDINGS_FILE" ]]; then
            echo "has_blocking_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_blocking_findings=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # Dismiss approvals when blocking findings exist. This is the merge gate:
      # PR cannot merge until someone re-approves after seeing the advisory.
      - name: Dismiss approvals if blocking findings
        if: always() && steps.review.outputs.has_blocking_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          FINDINGS_FILE: ${{ runner.temp }}/ai-review-findings.json
        run: |
          BLOCKING_COUNT=$(jq -r '.blocking_count // 0' "$FINDINGS_FILE")
          if (( BLOCKING_COUNT == 0 )); then
            echo "::notice title=No blocking findings::Advisory completed with no blocking findings."
            exit 0
          fi
          
          # Dismiss all approving reviews
          REVIEWS=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
            --jq '[.[] | select(.state == "APPROVED") | {id: .id, user: .user.login}]')
          
          DISMISSED=0
          echo "$REVIEWS" | jq -c '.[]' | while read -r review; do
            REVIEW_ID=$(echo "$review" | jq -r '.id')
            USER=$(echo "$review" | jq -r '.user')
            gh api --method PUT \
              "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}/dismissals" \
              -f message="Advisory AI review found ${BLOCKING_COUNT} blocking finding(s) (critical or high severity) after this approval. Please review the advisory comment posted by @noemi-reviewer-bot and re-approve when findings are addressed or accepted. See docs/AI_REVIEW_GOVERNANCE.md" \
              -f event=DISMISS || true
            echo "Dismissed approval from ${USER} (review ${REVIEW_ID})"
            DISMISSED=$((DISMISSED + 1))
          done
          
          if (( DISMISSED > 0 )); then
            echo "::warning title=Approvals dismissed::Dismissed ${DISMISSED} approval(s) due to ${BLOCKING_COUNT} blocking finding(s). Re-approve after reviewing advisory."
          else
            echo "::notice title=No approvals to dismiss::No existing approvals found on this PR."
          fi

      # Remove label if this was label-gated (secondary signal after dismissal)
      - name: Remove label if label-gated review with blocking findings
        if: |
          always() &&
          steps.pr.outputs.is_label_gated == 'true' &&
          steps.review.outputs.has_blocking_findings == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/labels/ai-review" || true
          echo "::notice title=Label removed::Removed 'ai-review' label as secondary signal after dismissing approvals."
