name: Validate Reference Architecture

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-fast:
    name: Audit, Generate, and Fast Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Show Node toolchain versions
        run: |
          node --version
          npm --version

      - name: Verify SecretOps CLIs availability
        run: |
          echo "Checking for mandatory SecretOps CLIs..."
          has_infisical=false
          has_op=false
          if command -v infisical >/dev/null 2>&1; then has_infisical=true; fi
          if command -v op >/dev/null 2>&1; then has_op=true; fi
          
          if [ "$has_infisical" = false ] && [ "$has_op" = false ]; then
            echo "::warning title=SecretOps CLI Missing::Neither Infisical nor 1Password CLI found in the CI environment. While CI will pass, local development mandates at least one."
          else
            echo "SecretOps CLI(s) found."
          fi

      - name: Run repository audit
        run: npm run audit

      - name: Run fast validation suite
        run: npm test

      - name: Regenerate context outputs
        run: npm run generate

      - name: Check generated context freshness
        run: |
          if ! git diff --exit-code -- GEMINI.md CLAUDE.md; then
            echo "::error::Generated context is stale. Run 'node scripts/generate_all.js' and commit the result."
            exit 1
          fi

  sync-upstream-regression:
    name: Sync-Upstream Regression Harness
    needs: validate-fast
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run sync-upstream offline harness
        # Offline harness for scripts/sync-upstream.sh — stubs `gh`, verifies override
        # surfacing, --continue resume, dry-run, and the duplicate guard. Wiring the
        # harness into CI closes the gap raised by Clarification [2026-07-11]
        # Sync-Upstream Test Harness Outside the Validation Gate (Decision [2026-07-13-0003]).
        run: npm run test:sync

  docker-smoke:
    name: Docker Smoke Validation
    needs: validate-fast
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run Docker smoke suite
        # FORCE_DOCKER_SMOKE promotes a missing Docker binary from "skip" to "fail" so a
        # misconfigured runner cannot produce a false green (Decision [2026-07-05-0006]).
        env:
          FORCE_DOCKER_SMOKE: "true"
        run: npm run test:e2e

      - name: Upload Docker smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-diagnostics
          path: test-artifacts/docker-smoke
          if-no-files-found: ignore
