# File mode (fallback without a vault): mount the private credential folder
# containing gcp-oauth.keys.json and credentials.json read-only at /run/gmail.
# Use compose.credentials-vault.yaml instead whenever a vault is configured.
services:
  app:
    volumes:
      - type: bind
        source: ${GMAIL_MCP_DIR:?Set GMAIL_MCP_DIR to your private credential folder}
        target: /run/gmail
        read_only: true
        bind:
          create_host_path: false
