# Gmail reads plus an existing Ollama API on host localhost (Linux).
# Use with compose.yaml; this command never applies labels.
# Also add one credential overlay: compose.credentials-vault.yaml or compose.credentials-files.yaml.
services:
  app:
    network_mode: host
    user: "${MAILSORT_UID:?Set MAILSORT_UID}:${MAILSORT_GID:?Set MAILSORT_GID}"
    entrypoint: ["python", "-m", "noemi_mailsort.dry_run"]
    command: []
