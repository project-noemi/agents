# Phase 1 of docs/AI_REVIEW_GOVERNANCE.md — cross-model review of
# agent-authored pull requests.
#
# The reviewer POSTS FINDINGS ONLY. It does not approve, merge, or close.
# Approval stays with a human until phase 2 is authorised by the evidence
# described in the governance doc.
#
# This workflow is intentionally NOT a required status check. A review that can
# block a merge is a gate; phase 1 is an advisory signal being calibrated. Do
# not add it to branch protection contexts before phase 2.
#
# FLEET DEPLOYMENT: this is a REUSABLE workflow (workflow_call). Other
# repositories run the reviewer through a thin caller — see
# templates/ci/ai-review-caller.yml — so the review logic exists in exactly one
# place. Reviewer scripts are always checked out from the tooling repository at
# a pinned ref, never from the pull request under review: a PR must not be able
# to rewrite the reviewer that judges it.
#
# Configuration comes from Actions VARIABLES resolved in the caller's context —
# set them at the ORGANIZATION level so member repos need none of their own.
# No credential is stored in GitHub. The GitHub token comes from Infisical via
# OIDC, and Google access comes from Workload Identity Federation — required
# here, since org policy disallows API keys and service-account keys alike.
#
# The carve-out, gate ordering, and severity rubric are enforced inside
# scripts/review-pr.js — deliberately not duplicated here. Two copies of a
# safety rule drift, and the copy in YAML is the one nobody unit-tests.
name: AI Review (advisory)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to review'
        required: true
        type: string
  workflow_call:
    inputs:
      pr:
        description: 'Pull request number (defaults to the triggering PR)'
        required: false
        type: string
      tooling-ref:
        description: 'Ref of project-noemi/agents to take reviewer scripts from'
        required: false
        type: string
        default: develop

permissions:
  contents: read
  pull-requests: write
  id-token: write          # required to mint the OIDC token for Infisical

concurrency:
  # Repository-qualified: many repos call this workflow, and PR numbers collide
  # across them.
  group: ai-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Cross-Model PR Review
    runs-on: ubuntu-latest
    steps:
      # ALWAYS the tooling repo at a pinned ref — never the PR head. The runner
      # fetches the diff over the API, so nothing from the reviewed PR's working
      # tree is needed or wanted: scripts taken from the PR would let a PR
      # rewrite its own reviewer. (The caller's thin workflow file remains the
      # caller's responsibility; the carve-out halts on changes to it.)
      - uses: actions/checkout@v4
        with:
          repository: project-noemi/agents
          ref: ${{ inputs.tooling-ref || 'develop' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Skip cleanly until the reviewer is provisioned. A workflow that goes red
      # on every pull request teaches people to ignore it before it has ever
      # been useful, and an advisory signal nobody reads is worse than none.
      - name: Check reviewer configuration
        id: config
        env:
          PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          missing=()
          [[ -z "${PROJECT_ID}"   ]] && missing+=(INFISICAL_PROJECT_ID)
          [[ -z "${IDENTITY_ID}"  ]] && missing+=(INFISICAL_IDENTITY_ID)
          [[ -z "${WIF_PROVIDER}" ]] && missing+=(GCP_WIF_PROVIDER)
          [[ -z "${GCP_SA}"       ]] && missing+=(GCP_SERVICE_ACCOUNT)
          if (( ${#missing[@]} )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=AI review skipped::Missing Actions variables: ${missing[*]}. Set them at the organization level. See docs/examples/cross-model-review-setup.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Federation, not a key. This organization's policy disallows both API
      # keys and service-account keys, so a short-lived federated token is the
      # only available mechanism — and the strongest one: nothing durable to
      # leak or rotate.
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.config.outputs.configured == 'true'
        id: gcpauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Install Infisical CLI
        if: steps.config.outputs.configured == 'true'
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical
          infisical --version

      # GitHub proves its own identity to Infisical and receives short-lived
      # access. Universal Auth would require storing a client secret here, which
      # reintroduces the two-places-to-rotate problem that vault-only storage
      # exists to avoid.
      - name: Authenticate to Infisical via OIDC
        if: steps.config.outputs.configured == 'true'
        env:
          IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          # Must match the audience configured on the Infisical identity's OIDC
          # auth method. A mismatch fails with 401 "OIDC audience not allowed",
          # which names the cause but not which side to change — it is this
          # value, or the identity's allowed-audience field.
          OIDC_AUDIENCE: ${{ vars.INFISICAL_OIDC_AUDIENCE || 'infisical' }}
        run: |
          JWT=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${OIDC_AUDIENCE}" | jq -r .value)
          if [[ -z "$JWT" || "$JWT" == "null" ]]; then
            echo "::error title=OIDC token unavailable::Could not mint a GitHub identity token. Confirm 'id-token: write' permission."
            exit 1
          fi
          TOKEN=$(infisical login --method=oidc-auth \
            --machine-identity-id="$IDENTITY_ID" --jwt="$JWT" --plain --silent)
          echo "::add-mask::$TOKEN"
          echo "INFISICAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      # PREFERRED fleet credential: a GitHub App installation token, minted
      # fresh for this run. One app installed on every organization replaces
      # per-org PATs and their rotation schedule; nothing long-lived exists at
      # runtime. Both steps no-op when REVIEWER_APP_ID is unset, and the runner
      # falls back to the PAT chain — so the fleet keeps working while the app
      # is being provisioned, and afterwards the PATs become dead weight to
      # retire rather than a dependency.
      - name: Fetch reviewer app key
        if: steps.config.outputs.configured == 'true' && vars.REVIEWER_APP_ID != ''
        env:
          PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
        run: |
          KEY=$(infisical secrets get REVIEWER_APP_PRIVATE_KEY \
            --projectId="$PROJECT_ID" --env=dev --plain)
          if [[ -z "$KEY" ]]; then
            echo "::error title=App key missing::REVIEWER_APP_ID is set but REVIEWER_APP_PRIVATE_KEY is not in Infisical."
            exit 1
          fi
          # ::add-mask:: masks single values; a PEM is multiline, so mask each
          # line or the key appears in the log the first time anything echoes it.
          while IFS= read -r line; do echo "::add-mask::$line"; done <<< "$KEY"
          {
            echo "REVIEWER_APP_KEY<<__PEM_EOF__"
            echo "$KEY"
            echo "__PEM_EOF__"
          } >> "$GITHUB_ENV"

      - name: Mint reviewer app token
        if: steps.config.outputs.configured == 'true' && vars.REVIEWER_APP_ID != ''
        id: apptoken
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REVIEWER_APP_ID }}
          private-key: ${{ env.REVIEWER_APP_KEY }}
          # Defaults to the installation for this repository's owner — exactly
          # the per-org selection the PAT path had to do by hand.

      # review-pr.js owns the carve-out check and refuses to invoke a model on a
      # governance-critical diff, so no model call happens before that decision.
      # Reviewer credential preference: app token, then per-org PAT, then the
      # home-org PAT (see the runner's header).
      - name: Run three-gate review
        if: steps.config.outputs.configured == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Empty when the app is not configured; the runner then falls back to
          # the PAT chain resolved from the vault. Distinct name on purpose:
          # `infisical run` injects the whole project, and a stored PAT under
          # the same name would silently shadow a minted app token.
          REVIEWER_APP_TOKEN: ${{ steps.apptoken.outputs.token }}
          GEMINI_REVIEW_FLOOR: ${{ vars.GEMINI_REVIEW_FLOOR || 'flash' }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          # Resolves on all triggers: the event on pull_request, the input on
          # dispatch and on workflow_call.
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          # Short-lived, federated. Never a stored credential.
          GCP_ACCESS_TOKEN: ${{ steps.gcpauth.outputs.access_token }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT || 'project-noemi' }}
          # global, not a region: the publisher catalogue is global and regional
          # availability lags it (gemini-3.x 404s in us-central1).
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
          GEMINI_BACKEND: ${{ vars.GEMINI_BACKEND || 'vertex' }}
          # prefer_pro_tier: opt-in. Off by default so selection follows the
          # newest-stable-generation rule rather than silently regressing a
          # generation to satisfy a tier preference.
          GEMINI_PREFER_PRO: ${{ vars.GEMINI_PREFER_PRO || '' }}
        run: |
          # ONLY exit 3 means "halted by design" (carve-out, or no model met the
          # floor). Every other non-zero code is a real failure and must stay
          # red.
          #
          # This previously accepted exit 1, which `infisical run` also returns
          # on its own auth/permission errors. A broken run therefore reported
          # success and posted nothing — the exact "looks like success but is
          # not" outcome this pipeline exists to prevent.
          set +e
          infisical run --projectId="$INFISICAL_PROJECT_ID" --env=dev -- \
            node scripts/review-pr.js --pr "$PR_NUMBER"
          code=$?
          set -e
          if [[ $code -eq 3 ]]; then
            echo "::notice title=Review halted::Escalated to human review by design. See the PR comment."
            exit 0
          fi
          if [[ $code -ne 0 ]]; then
            echo "::error title=Review failed::review-pr.js or its wrapper exited ${code}. No review was performed."
          fi
          exit $code
