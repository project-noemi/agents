# Coding loop — fleet caller.
#
# Delegates to project-noemi/agents so loop logic lives in one place.
# Enable after vars.CODING_LOOP_BUDGET_OK=true and a conductor token exist.
# Optional: vars.CODING_LOOP_LIVE_CRITIC=true plus org WIF for Gemini B′.
# Does not approve, merge, or write code.
# Passes exactly the two secrets the loop declares — never `secrets: inherit`,
# which would hand every secret of this repository to the reusable workflow.
name: Coding Loop

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number'
        required: true
        type: string

jobs:
  loop:
    uses: project-noemi/agents/.github/workflows/coding-loop.yml@main
    permissions:
      contents: read
      issues: write
    secrets:
      CONDUCTOR_GH_TOKEN: ${{ secrets.CONDUCTOR_GH_TOKEN }}
      AGENT_GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
    with:
      issue: ${{ inputs.issue || github.event.issue.number }}
