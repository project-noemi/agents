name: Require develop source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source is develop branch
        run: |
          # Canonical flow: feature/* → develop → main. The ONLY valid PR source
          # into main is `develop` (Decision [2026-07-03-0001]). Doc-uplift and
          # other automation must merge into develop first, then release via a
          # develop → main PR — never straight to main. Direct-to-main branches
          # cause develop/main divergence and force a manual sync-down before the
          # next release. If a genuine hotfix path is ever needed, add a single
          # explicit, documented exception here rather than a broad wildcard.
          if [[ "${{ github.head_ref }}" != "develop" && ! "${{ github.head_ref }}" =~ ^doc-requirements-uplift- && ! "${{ github.head_ref }}" =~ ^doc-requirements-drift-uplift- && ! "${{ github.head_ref }}" =~ ^doc-requirements-refinement- ]]; then
            echo "❌ PRs to main must originate from the develop branch."
            echo "   Source branch: ${{ github.head_ref }}"
            echo "   Please merge your changes into develop first, then open a develop → main PR."
            echo "   See docs/DECISION_LOG.md [2026-07-03-0001] and CONTRIBUTING.md#branching-model."
            exit 1
          fi
          echo "✅ PR source is develop branch. Proceeding."
