# Vault mode (preferred): Gmail OAuth JSON comes from process memory, not disk.
# Start Compose through your SecretOps CLI so both values exist only in its
# environment, for example: infisical run --env=dev -- docker compose ...
# The application writes them as owner-only files to the container's /tmp tmpfs
# and removes them from its environment; no credential folder is mounted.
# Docker records passed-through values in the container configuration, so
# anyone who can run `docker inspect` on this host can read them.
services:
  app:
    environment:
      MAILSORT_GMAIL_CREDENTIALS: vault
      # Names only: Compose copies each value from its own environment.
      GMAIL_OAUTH_KEYS_JSON:
      GMAIL_CREDENTIALS_JSON:
