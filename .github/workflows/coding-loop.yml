# Coding loop pickup — reusable. Thin callers live in
# templates/ci/coding-loop-caller.yml. Logic is coding-loop/run.js.
#
# Does not approve or merge. Conductor comments only when a conductor
# credential is injected: CONDUCTOR_APP_ID + CONDUCTOR_APP_PRIVATE_KEY
# (the runtime mints a one-hour installation token per run, docs/MACHINE_IDENTITY.md)
# or an already-minted CONDUCTOR_GH_TOKEN. Every secret arrives BY NAME
# from the caller (never `secrets: inherit`). The run is attributed to the
# person who triggered it (issue opener / dispatcher) via --requested-by;
# without write access on the repo they are refused. Budget is fail-closed: set
# vars.CODING_LOOP_BUDGET_OK=true to assert capacity. Live Gemini B′ is
# fail-closed too: set vars.CODING_LOOP_LIVE_CRITIC=true and org WIF
# (same vars as the fleet reviewer). Unset, Stage B′ stays structural.
# Stage C opens a noemi-agent PR when AGENT_GH_TOKEN and a writer key
# (AI_GW_API_TOKEN, else AI_GW_API_KEY, else XAI_API_KEY) are both present
# (Decision [2026-10-29-0001]). Missing the writer key still prepares the envelope.
# Robot and model credentials (Decision [2026-11-05-0001]): when both
# INFISICAL_PROJECT_ID and INFISICAL_IDENTITY_ID are set, those four values
# are read by name from Infisical (OIDC, env dev, path /) and the Actions
# secrets of the same names are ignored. Neither variable set keeps direct
# mode. One of the two fails the job. A present producer token is checked
# against GET /user and must be noemi-agent before the loop starts.
# Actions variable AGENT_GH_USE_CLASSIC=true (Decision [2026-11-10-0001]) selects the classic
# cross-organization producer token under the name AGENT_GH_TOKEN_CLASSIC in both modes, for a
# caller outside the producer's home organization; there is no fallback to AGENT_GH_TOKEN.
name: Coding Loop

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'owner/name (defaults to this repository)'
        required: false
        type: string
      issue:
        description: 'Issue number'
        required: true
        type: string
      profile:
        description: 'code (default) or spec (agents and skills only)'
        required: false
        type: string
        default: code
  workflow_call:
    inputs:
      repo:
        required: false
        type: string
      issue:
        required: false
        type: string
      tooling-ref:
        required: false
        type: string
        default: main
      profile:
        description: 'code (default) or spec (agents and skills only)'
        required: false
        type: string
        default: code
    # Declared so callers pass exactly these instead of `secrets: inherit`, which would
    # hand every secret of the calling repository to this workflow. All stay optional:
    # without a conductor credential the loop runs without --post (it reads the issue with
    # github.token and posts nothing); without AGENT_GH_TOKEN it never opens a PR;
    # without a writer key it prepares the Stage C envelope and leaves opened: false;
    # without the App key and the registry, client entitlement fails closed.
    # The App pair is the standard conductor credential (docs/MACHINE_IDENTITY.md): the
    # runtime mints a one-hour installation token for the repository owner on every run.
    # CONDUCTOR_GH_TOKEN is the already-minted override for debugging the mint path.
    secrets:
      CONDUCTOR_APP_ID:
        description: 'Conductor GitHub App id; with CONDUCTOR_APP_PRIVATE_KEY the runtime mints an installation token per run'
        required: false
      CONDUCTOR_APP_PRIVATE_KEY:
        description: 'Conductor GitHub App private key (PEM)'
        required: false
      CONDUCTOR_GH_TOKEN:
        description: 'Already-minted conductor installation token (debugging override; comments and labels as noemi-conductor)'
        required: false
      AGENT_GH_TOKEN:
        description: 'Producer token (opens the PR as noemi-agent). Ignored when vault mode is configured.'
        required: false
      AGENT_GH_TOKEN_CLASSIC:
        description: 'Classic cross-organization producer token; read only when vars.AGENT_GH_USE_CLASSIC is true. Ignored in vault mode.'
        required: false
      AI_GW_API_TOKEN:
        description: 'NewPush AI gateway key for Stage C --open-pr (wins over XAI_API_KEY). Ignored in vault mode.'
        required: false
      AI_GW_API_KEY:
        description: 'Alias for AI_GW_API_TOKEN. Ignored in vault mode.'
        required: false
      XAI_API_KEY:
        description: 'Direct api.x.ai key for Stage C --open-pr when no gateway key is set. Ignored in vault mode.'
        required: false
      NOEMI_CLIENT_REGISTRY:
        description: 'JSON client-org registry for entitlement (NewPush dispatchers; leave unset elsewhere)'
        required: false

permissions:
  contents: read
  issues: write

jobs:
  intake:
    name: Stage A–C prepare
    runs-on: ubuntu-latest
    # One loop per repo+issue at a time: two runs racing on the same issue
    # would both comment, fight over the noemi:* label, and both try to
    # create noemi/issue-N. Job level so it holds under workflow_call too.
    # Queue, never cancel a run mid-write.
    concurrency:
      group: coding-loop-${{ inputs.repo || github.repository }}-${{ inputs.issue || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      id-token: write      # Infisical OIDC when vault variables are set; WIF when live-critic is set. The caller must grant it.
    steps:
      - uses: actions/checkout@v4
        with:
          repository: project-noemi/agents
          ref: ${{ inputs.tooling-ref || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve credential source
        id: creds
        env:
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
        run: node coding-loop/actions-credentials.js --mode-only

      - name: Check live-critic configuration
        id: critic
        env:
          LIVE: ${{ vars.CODING_LOOP_LIVE_CRITIC }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          if [[ "${LIVE}" != "true" ]]; then
            echo "wanted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=()
          [[ -z "${WIF_PROVIDER}" ]] && missing+=(GCP_WIF_PROVIDER)
          [[ -z "${GCP_SA}" ]] && missing+=(GCP_SERVICE_ACCOUNT)
          if (( ${#missing[@]} )); then
            echo "::error title=live-critic requested without WIF::Missing: ${missing[*]}. Unset CODING_LOOP_LIVE_CRITIC or set the same org WIF vars as the fleet reviewer."
            exit 1
          fi
          echo "wanted=true" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.critic.outputs.wanted == 'true'
        id: gcpauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Install Infisical CLI
        if: steps.creds.outputs.mode == 'vault'
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get install -y infisical
          infisical --version

      - name: Run coding loop
        env:
          GH_TOKEN: ${{ secrets.CONDUCTOR_GH_TOKEN || github.token }}
          CONDUCTOR_GH_TOKEN: ${{ secrets.CONDUCTOR_GH_TOKEN }}
          CONDUCTOR_APP_ID: ${{ secrets.CONDUCTOR_APP_ID || vars.CONDUCTOR_APP_ID }}
          CONDUCTOR_APP_PRIVATE_KEY: ${{ secrets.CONDUCTOR_APP_PRIVATE_KEY }}
          AGENT_GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
          AGENT_GH_TOKEN_CLASSIC: ${{ secrets.AGENT_GH_TOKEN_CLASSIC }}
          AGENT_GH_USE_CLASSIC: ${{ vars.AGENT_GH_USE_CLASSIC }}
          AI_GW_API_TOKEN: ${{ secrets.AI_GW_API_TOKEN }}
          AI_GW_API_KEY: ${{ secrets.AI_GW_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          NOEMI_CLIENT_REGISTRY: ${{ secrets.NOEMI_CLIENT_REGISTRY }}
          MODE: ${{ steps.creds.outputs.mode }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_OIDC_AUDIENCE: ${{ vars.INFISICAL_OIDC_AUDIENCE || 'infisical' }}
          INFISICAL_DISABLE_UPDATE_CHECK: 'true'
          # The human who triggered the run, never the bot: the issue opener
          # for `issues`, the dispatcher otherwise. Passed through env, never
          # interpolated into the script (a login is attacker-chosen text).
          REQUESTED_BY: ${{ github.event_name == 'issues' && github.event.sender.login || github.actor }}
          ISSUE: ${{ inputs.issue || github.event.issue.number }}
          REPO: ${{ inputs.repo || github.repository }}
          BUDGET_OK: ${{ vars.CODING_LOOP_BUDGET_OK }}
          LIVE_CRITIC: ${{ vars.CODING_LOOP_LIVE_CRITIC }}
          PROFILE: ${{ inputs.profile || 'code' }}
          GCP_ACCESS_TOKEN: ${{ steps.gcpauth.outputs.access_token }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT || 'project-noemi' }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION || 'global' }}
          GEMINI_BACKEND: ${{ vars.GEMINI_BACKEND || 'vertex' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" != "direct" && "$MODE" != "vault" ]]; then
            echo "::error title=Credential mode::Expected direct or vault."
            exit 1
          fi
          if [[ "$MODE" == "vault" ]]; then
            node coding-loop/actions-credentials.js --check-audience
            OIDC_AUDIENCE="$INFISICAL_OIDC_AUDIENCE"
            JWT=$(curl -sfS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${OIDC_AUDIENCE}" | jq -r .value)
            if [[ -z "$JWT" || "$JWT" == "null" ]]; then
              echo "::error title=OIDC token unavailable::Could not mint a GitHub identity token."
              exit 1
            fi
            echo "::add-mask::$JWT"
            vault_home=$(mktemp -d "${RUNNER_TEMP:-/tmp}/infisical-home.XXXXXX")
            set +e
            access=$(HOME="$vault_home" infisical login --method=oidc-auth \
              --machine-identity-id="$INFISICAL_IDENTITY_ID" --jwt="$JWT" --plain --silent 2>/dev/null)
            login_rc=$?
            set -e
            unset JWT
            if [[ "$login_rc" -ne 0 || -z "${access:-}" ]]; then
              unset access
              rm -rf "$vault_home"
              echo "::error title=Infisical login failed::OIDC login did not return an access token."
              exit 1
            fi
            export FETCHED_PLAIN="$access"
            if ! token_class=$(node coding-loop/actions-credentials.js --classify); then
              unset FETCHED_PLAIN access
              rm -rf "$vault_home"
              exit 1
            fi
            unset FETCHED_PLAIN
            if [[ "$token_class" != "present" ]]; then
              unset access
              rm -rf "$vault_home"
              echo "::error title=Infisical login failed::OIDC login did not return an access token."
              exit 1
            fi
            echo "::add-mask::$access"
            if infisical secrets-manager --help >/dev/null 2>&1; then
              export INFISICAL_CLI_SHAPE=current
            elif infisical secrets get --help >/dev/null 2>&1; then
              export INFISICAL_CLI_SHAPE=legacy
            else
              unset access
              rm -rf "$vault_home"
              echo "::error title=Infisical CLI::The installed CLI has no named secret-read command."
              exit 1
            fi
            # Vault wins for these four names. Clear any direct-mode values first.
            AGENT_GH_TOKEN=""
            AI_GW_API_TOKEN=""
            AI_GW_API_KEY=""
            XAI_API_KEY=""
            AGENT_GH_TOKEN_CLASSIC=""
            unset INFISICAL_SECRET_PATH
            names=$(node coding-loop/actions-credentials.js --secret-names)
            while IFS= read -r name; do
              [[ -z "$name" ]] && continue
              case "$name" in
                AGENT_GH_TOKEN|AGENT_GH_TOKEN_CLASSIC|AI_GW_API_TOKEN|AI_GW_API_KEY|XAI_API_KEY) ;;
                *)
                  unset access
                  rm -rf "$vault_home"
                  echo "::error title=Secret name::Refusing an unexpected secret name."
                  exit 1
                  ;;
              esac
              argv_text=$(node coding-loop/actions-credentials.js --secret-argv "$name")
              mapfile -t argv <<< "$argv_text"
              set +e
              raw=$(HOME="$vault_home" INFISICAL_TOKEN="$access" infisical "${argv[@]}" 2>/dev/null)
              read_rc=$?
              set -e
              if [[ "$read_rc" -ne 0 ]]; then
                unset raw access
                rm -rf "$vault_home"
                echo "::error title=Infisical read failed::Could not read ${name}."
                exit 1
              fi
              export FETCHED_PLAIN="$raw"
              if ! class=$(node coding-loop/actions-credentials.js --classify); then
                unset FETCHED_PLAIN raw access
                rm -rf "$vault_home"
                exit 1
              fi
              unset FETCHED_PLAIN
              if [[ "$class" == "present" ]]; then
                echo "::add-mask::$raw"
                printf -v "$name" '%s' "$raw"
              elif [[ "$class" == "absent" ]]; then
                printf -v "$name" '%s' ""
              else
                unset raw access
                rm -rf "$vault_home"
                echo "::error title=Unexpected secret classification::Refusing to export ${name}."
                exit 1
              fi
              unset raw
            done <<< "$names"
            unset names argv_text
            unset access INFISICAL_TOKEN INFISICAL_CLI_SHAPE
            rm -rf "$vault_home"
          fi
          unset INFISICAL_TOKEN
          extra=()
          if [[ "${BUDGET_OK}" == "true" ]]; then
            extra+=(--budget-ok)
          fi
          if [[ "${LIVE_CRITIC}" == "true" ]]; then
            if [[ -z "${GCP_ACCESS_TOKEN:-}" ]]; then
              echo "::error title=live-critic without ADC::WIF did not yield GCP_ACCESS_TOKEN."
              exit 1
            fi
            extra+=(--live-critic)
          fi
          if [[ -n "${CONDUCTOR_GH_TOKEN:-}" || ( -n "${CONDUCTOR_APP_ID:-}" && -n "${CONDUCTOR_APP_PRIVATE_KEY:-}" ) ]]; then
            extra+=(--post)
          fi
          # Empty requester: omit the flag; run.js then refuses the issue as
          # trigger-unverified (fail closed) instead of exiting on a bad flag.
          if [[ -n "${REQUESTED_BY:-}" ]]; then
            extra+=(--requested-by "$REQUESTED_BY")
          fi
          # The producer secret for this run: AGENT_GH_TOKEN, or AGENT_GH_TOKEN_CLASSIC when the
          # caller sets vars.AGENT_GH_USE_CLASSIC (a target outside the producer's home
          # organization). run.js applies the same switch and never falls back.
          producer_name=$(node coding-loop/actions-credentials.js --producer-name)
          producer_token="${!producer_name:-}"
          if [[ -n "$producer_token" ]]; then
            if ! command -v gh >/dev/null 2>&1; then
              echo "::error title=Producer identity::gh is required to verify the producer login before producer writes."
              exit 1
            fi
            login=$(GH_TOKEN="$producer_token" gh api user --jq .login)
            LOGIN_TO_ASSERT="$login" node coding-loop/actions-credentials.js --assert-login
            unset login LOGIN_TO_ASSERT
            extra+=(--implement)
            if [[ -n "${AI_GW_API_TOKEN:-}${AI_GW_API_KEY:-}${XAI_API_KEY:-}" ]]; then
              extra+=(--open-pr)
            fi
          fi
          unset producer_token producer_name
          node coding-loop/run.js --repo "$REPO" --issue "$ISSUE" --scan --profile "$PROFILE" "${extra[@]}"
